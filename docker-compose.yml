# ─────────────────────────────────────────────────────────────────────────────
# GRAG AI — Full Stack Docker Compose
# Services: Neo4j | Ollama (GPU) | FastAPI GRAG Pipeline | Open WebUI (GPU)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Neo4j Knowledge Graph ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: grag-neo4j
    ports:
      - "7474:7474"    # HTTP browser
      - "7687:7687"    # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    restart: unless-stopped
    networks:
      - grag-edge-net

  # ── Ollama Local LLM — NVIDIA GPU ─────────────────────────────────────────
  ollama:
    image: ${OLLAMA_IMAGE:-grag-edge-ollama:cpu}
    container_name: grag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # ollama/ollama image has no curl — use the ollama CLI to check readiness
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - grag-edge-net

  # ── Ollama Model Puller — runs once after Ollama starts ──────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: grag-ollama-init
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=${OLLAMA_DOCKER_BASE_URL:-http://ollama:11434}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo 'Waiting for Ollama...' &&
      sleep 5 &&
      ollama pull ${OLLAMA_MODEL:-qwen3.5:0.8b} &&
      ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
      echo 'All models ready.'
    restart: on-failure
    networks:
      - grag-edge-net

  # ── Fleet Qdrant Server (cloud-only; no host port) ────────────────────────
  qdrant-server:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant_server_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - grag-cloud-net

  # ── GRAG FastAPI Pipeline ─────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grag-api
    ports:
      - "8000:8000"
    volumes:
      - edge_data:/data
    environment:
      # Override localhost addresses for Docker networking
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OLLAMA_BASE_URL=${OLLAMA_DOCKER_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:0.8b}
      - QDRANT_EDGE_PATH=/data/qdrant-edge
      - EDGE_EMBEDDING_DIMENSION=768
      - EDGE_STATE_PATH=/data/edge-state.db
      - DEVICE_ID=${DEVICE_ID:-robot-edge-001}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant-server:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-grag_fleet_memory}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:0.8b}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL:-https://api.ollama.com/v1}
      - OLLAMA_CLOUD_MODEL=${OLLAMA_CLOUD_MODEL:-minimax-m2.7:cloud}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-grag_fleet_memory}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EDGE_STATE_PATH=/data/edge-state.db
      - DEVICE_ID=${DEVICE_ID:-robot-edge-001}
      - CONNECTIVITY_INTERVAL_SECONDS=${CONNECTIVITY_INTERVAL_SECONDS:-5}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-grag-pipeline-v1}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - grag-edge-net
      - grag-cloud-net

  # ── Optional Robot B (fleet-demo profile): isolated shard + SQLite volume ──
  robot-b-api:
    profiles: ["fleet-demo"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grag-robot-b-api
    ports:
      - "8002:8000"
    volumes:
      - robot_b_data:/data
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OLLAMA_BASE_URL=${OLLAMA_DOCKER_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:0.8b}
      - QDRANT_EDGE_PATH=/data/qdrant-edge
      - EDGE_EMBEDDING_DIMENSION=768
      - EDGE_STATE_PATH=/data/edge-state.db
      - DEVICE_ID=ROBOT-02
      - QDRANT_URL=${QDRANT_URL:-http://qdrant-server:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-grag_fleet_memory}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - CONNECTIVITY_INTERVAL_SECONDS=${CONNECTIVITY_INTERVAL_SECONDS:-5}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-grag-pipeline-v1}
    depends_on:
      ollama:
        condition: service_healthy
      qdrant-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - grag-edge-net
      - grag-cloud-net

  # ── GRAG Edge operations console (depends only on the edge API) ───────────
  grag-edge-ui:
    build:
      context: ./frontend
    container_name: grag-edge-ui
    ports:
      - "${EDGE_UI_PORT:-5173}:80"
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grag-edge-net

  # ── Open WebUI — Chat Interface ───────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: grag-open-webui
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      # ── Ollama integration (for direct model access in WebUI) ──────────────
      - OLLAMA_BASE_URL=http://ollama:11434

      # ── GRAG pipeline as OpenAI-compatible backend ─────────────────────────
      # This is the primary custom backend — GRAG pipeline appears as a model
      - OPENAI_API_BASE_URL=http://fastapi:8000/v1
      - OPENAI_API_KEY=${API_KEY:-grag-local}

      # ── Authentication ────────────────────────────────────────────────────
      - WEBUI_AUTH=true

      # ── Disable telemetry ─────────────────────────────────────────────────
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false

      # ── WebUI settings ────────────────────────────────────────────────────
      - WEBUI_NAME=GRAG AI
    depends_on:
      fastapi:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - grag-edge-net

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
networks:
  grag-edge-net:
    name: grag-edge-net
  grag-cloud-net:
    name: grag-cloud-net
    internal: true

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
    name: grag-edge-ollama-data
    external: true
  edge_data:
  robot_b_data:
  qdrant_server_data:
  open_webui_data:
